user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    # ERR_CONTENT_LENGTH_MISMATCH 방지: 대용량 JS/CSS 파일 버퍼 설정
    output_buffers 2 512k;
    postpone_output 0;

    # [보완] 운영 환경 성능 최적화를 위한 Gzip 설정
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/font-woff2 font/woff2;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 1. 정적 자원 (가장 구체적인 경로를 최상단으로)
        location ^~ /home/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-ASSETS-PRD" always;
        }

        # 2. 백엔드 Proxy 설정 (구체적 경로 선언)
        location ^~ /home/api/ {
            rewrite ^/home/api/(.*)$ /api/$1 break;
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-BE-PRD" always;
        }

        location ^~ /home/actuator/ {
            rewrite ^/home/actuator/(.*)$ /actuator/$1 break;
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Matched-By "API-PROXY-ACTUATOR-PRD" always;
        }

        # 3. 메인 컨텍스트 패스 (SPA 라우팅 핵심)
        # API 블록들보다 아래에 위치시켜 매칭 간섭을 방지합니다.
        location ^~ /home/ {
            root /usr/share/nginx/html/;
            index index.html;
            # [보완] 컨텍스트 패스를 포함한 index.html로 명시적 폴백
            try_files $uri $uri/ /home/index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Matched-By "STATIC-HOME-PRD" always;
        }

        location ^~ /api/ {
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_cache_bypass $http_upgrade;
            add_header X-Matched-By "API-PROXY-ROOT" always;
        }

        # 4. 기타 시스템 공통 설정
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}