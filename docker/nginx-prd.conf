user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        location = /home {
            return 301 /home/;
        }

        location ^~ /home/api/ {
            rewrite ^/home/(.*)$ /$1 break;
            proxy_pass http://smep-be-prd.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-BE-PRD" always;
        }

        location ^~ /home/actuator/ {
            rewrite ^/home/(.*)$ /$1 break;
            proxy_pass http://smep-be-prd.smepbe:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-ACTUATOR-PRD" always;
        }

        location ^~ /home/example {
            rewrite ^/home/(.*)$ /$1 break;
            proxy_pass http://smep-be-prd.smepbe:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /api/ {
            return 404;
        }

        location ^~ /home/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        location ^~ /home/ {
            try_files $uri $uri/ /index.html;
            add_header X-Matched-By "STATIC-BE-FALLBACK-PRD" always;
            add_header Cache-Control "no-store" always;
        }

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
