user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # WebSocket Upgrade 헤더 매핑
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    # 운영 환경 Gzip 압축
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        # 운영: www.smes.go.kr 에서 서비스됨
        # server_name  www.smes.go.kr;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # ──────────────────────────────────────────────────────────────
        # 1. 정적 자원 — 가장 구체적인 경로 최상단 (캐시 최대화)
        #    빌드 산출물: /usr/share/nginx/html/assets/
        #    요청 경로:  /home/assets/...  (VITE_BASE=/home/ 빌드 기준)
        # ──────────────────────────────────────────────────────────────
        location ^~ /home/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-ASSETS-PRD" always;
        }

        # ──────────────────────────────────────────────────────────────
        # 2. 백엔드 Proxy — /home/api/ 요청을 /api/ 로 rewrite 후 전달
        #    원인: VITE_BASE=/home/ 이므로 프론트엔드 apiClient가
        #          /home/api/... 형태로 요청을 생성함.
        #          개발(nginx.conf)의 API 프록시 블록과 동일한 패턴,
        #          컨텍스트 패스를 /home/ 으로 교체한 운영 전용 설정.
        # ──────────────────────────────────────────────────────────────
        location ^~ /home/api/ {
            rewrite ^/home/api/(.*)$ /api/$1 break;
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-BE-PRD" always;
        }

        # Actuator (헬스체크 / 메트릭) 프록시
        location ^~ /home/actuator/ {
            rewrite ^/home/actuator/(.*)$ /actuator/$1 break;
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Matched-By "API-PROXY-ACTUATOR-PRD" always;
        }

        # ──────────────────────────────────────────────────────────────
        # 3. SPA 메인 컨텍스트 — /home/ 하위 모든 경로를 index.html 로 폴백
        #    반드시 API 블록보다 아래에 위치 (^~ 우선순위 충돌 방지)
        # ──────────────────────────────────────────────────────────────
        location ^~ /home/ {
            root /usr/share/nginx/html/;
            index index.html;
            try_files $uri $uri/ /home/index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Matched-By "STATIC-HOME-PRD" always;
        }

        # ──────────────────────────────────────────────────────────────
        # 4. 직접 /api/ 호출 호환성 유지 (CDN / 내부 호출 등)
        # ──────────────────────────────────────────────────────────────
        location ^~ /api/ {
            proxy_pass http://smep-be-prd.smes.go.kr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host smep-be-prd.smes.go.kr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Matched-By "API-PROXY-ROOT" always;
        }

        # ──────────────────────────────────────────────────────────────
        # 5. 시스템 공통
        # ──────────────────────────────────────────────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # 루트 요청 처리 (컨텍스트 패스 외 직접 접근 시 폴백)
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
