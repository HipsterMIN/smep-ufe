user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        location ^~ /home-dev/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        location ^~ /home-dev/api/ {
            rewrite ^/home-dev/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-BE-DEV" always;
        }

        location ^~ /home-dev/actuator/ {
            rewrite ^/home-dev/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY-ACTUATOR-DEV" always;
        }

        location ^~ /home-dev/example {
            rewrite ^/home-dev/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location ^~ /home-dev/ {
            # alias 보다는 root 내부의 하위 디렉토리 구조를 권장하지만,
            # 현재 구조 유지를 위해 alias 사용 시 정확한 index 처리
            alias /usr/share/nginx/html/;
            index index.html;

            # $uri에서 /home-dev/를 제거한 나머지 경로로 파일을 찾도록 유도
            # (이 부분은 빌드된 파일들이 /html/ 폴더 바로 밑에 있는지 확인이 필요함)
            try_files $uri $uri/ /index.html =404;

            add_header X-Matched-By "STATIC-HOME-DEV" always;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /api/ {
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            add_header X-Matched-By "API-PROXY-ROOT" always;
        }

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
