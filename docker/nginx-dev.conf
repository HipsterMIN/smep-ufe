user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # -----------------------------
        # 1) SPA 정적 파일 루트
        # -----------------------------
        root /usr/share/nginx/html;

        # -----------------------------
        # 2) 정적 파일 (JS/CSS/Assets)
        # -----------------------------
        location ^~ /home/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-ASSETS" always;
        }

        # JS/CSS 해시 파일 (index-xxxx.js)
        location ~* ^/home/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif)$ {
            alias /usr/share/nginx/html/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-FILES" always;
        }

        # -----------------------------
        # 3) API Proxy
        # -----------------------------
        location ^~ /home/api/ {
            rewrite ^/home/api/(.*)$ /api/$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Matched-By "API-PROXY" always;
        }

        # -----------------------------
        # 4) SPA 라우팅 (핵심)
        # -----------------------------
        location ^~ /home/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /home/index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Matched-By "SPA-ROUTER" always;
        }

        # -----------------------------
        # 5) 루트 fallback
        # -----------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------
        # 6) 헬스체크
        # -----------------------------
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
