user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # gzip은 명시적으로 켜거나 끄는 것이 안전함
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/javascript;
    gzip_min_length 1024;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 500M;

    server {
        listen       80;
        server_name  _;

        # SPA root
        root   /usr/share/nginx/html;
        index  index.html;

        # -----------------------------------------
        # 1) /home-dev → /home-dev/ 리다이렉트 제거
        #    (alias + try_files 충돌 원인)
        # -----------------------------------------
        # location = /home-dev {
        #     return 301 /home-dev/;
        # }

        # -----------------------------------------
        # 2) /home-dev/assets → 정적 파일 캐싱
        # -----------------------------------------
        location ^~ /home-dev/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-ASSETS" always;
        }

        # -----------------------------------------
        # 3) /home-dev/api → 백엔드 프록시
        # -----------------------------------------
        location ^~ /home-dev/api/ {
            rewrite ^/home-dev/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            add_header X-Matched-By "API-PROXY" always;
        }

        # -----------------------------------------
        # 4) /home-dev → SPA fallback (핵심 수정)
        # -----------------------------------------
        location ^~ /home-dev/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Matched-By "SPA-FALLBACK" always;
        }

        # -----------------------------------------
        # 5) 루트 경로 fallback
        # -----------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------
        # 6) 기타 설정
        # -----------------------------------------
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
