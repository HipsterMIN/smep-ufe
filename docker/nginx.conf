user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # gzip on; # 필요 시 활성화

    # 백엔드 API가 호스트(또는 동일 VM)에서 8081로 떠있는 경우
    upstream backend_local {
        server 127.0.0.1:8081;
    }

    server {
        listen       80;
        server_name  localhost;

        # 정적 빌드 파일 기본 경로
        root   /usr/share/nginx/html;
        index  index.html;

        # 1) 공통 정적 리소스 캐싱 및 컨텍스트 제거
        # 모든 컨텍스트(/main-dev/, /main/)에서 공통으로 사용되는 자원 처리
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|json)$ {
            rewrite ^/main-(?:dev/)?(.*)$ /$1 break;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 2) API 프록시 - 개발 환경 (/main-dev/api/)
        location ^~ /main-dev/api/ {
            rewrite ^/main-dev/api/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # 3) API 프록시 - 운영 환경 (/main/api/)
        location ^~ /main/api/ {
            rewrite ^/main/api/(.*)$ /$1 break;
            proxy_pass http://smep-be.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # 4) SPA 컨텍스트 경로 핸들러 (리다이렉트 없이 URI만 재작성하여 내부 리다이렉트 유도)
        location /main-dev/ {
            rewrite ^/main-dev/(.*)$ /$1 last;
        }

        location /main/ {
            rewrite ^/main/(.*)$ /$1 last;
        }

        # 5) 루트(/) 접근 시 기본 컨텍스트로 리다이렉트 (사용자 편의)
        location = / {
            return 301 /main-dev/;
        }

        # 6) 최종 SPA 폴백
        # rewrite ... last 로 들어온 요청이나 기타 요청 처리
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
        }

        # 에러 페이지
        error_page   500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
