user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # gzip on; # 필요 시 활성화

    # 백엔드 API가 호스트(또는 동일 VM)에서 8081로 떠있는 경우
    upstream backend_local {
        server 127.0.0.1:8081;
    }

    server {
        listen       80;
        server_name  localhost;

        # 정적 빌드 파일 경로 (기본 Nginx 이미지)
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 1) API 및 SPA - 개발 컨텍스트: /main-dev
        location ^~ /main-dev/api/ {
            rewrite ^/main-dev/api/(.*)$ /$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location ^~ /main-dev/ {
            root   /usr/share/nginx/html;
            rewrite ^/main-dev/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;

            # 정적 리소스 캐싱
            location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                try_files $uri =404;
            }
        }

        # 2) API 및 SPA - 운영 컨텍스트: /main
        location ^~ /main/api/ {
            rewrite ^/main/api/(.*)$ /$1 break;
            proxy_pass http://smep-be.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location ^~ /main/ {
            root   /usr/share/nginx/html;
            rewrite ^/main/(.*)$ /$1 break;
            try_files $uri $uri/ /index.html;

            # 정적 리소스 캐싱
            location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                try_files $uri =404;
            }
        }

        # 4) 루트(/) 접근 시 기본 컨텍스트로 리다이렉트 (선택)
        location = / {
            return 301 /main-dev/;
        }

        # 5) SPA 라우팅 폴백 (기타 경로)
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Matched-By "SPA-FALLBACK" always;
        }

        # 5) 잡다한 정적 리소스 예외
        location = /favicon.ico { log_not_found off; access_log off; }

        # 6) 에러 페이지
        error_page   500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
