user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # ---------------------------------------------------------
        # 0. /home-dev → /home-dev/ 리다이렉트
        # ---------------------------------------------------------
        location = /home-dev {
            return 301 /home-dev/;
        }

        # ---------------------------------------------------------
        # 1. API 프록시
        # ---------------------------------------------------------
        location ^~ /home-dev/api/ {
            rewrite ^/home-dev/api/(.*)$ /api/$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            add_header X-Matched-By "API-PROXY-BE-DEV" always;
        }

        location ^~ /home-dev/actuator/ {
            rewrite ^/home-dev/actuator/(.*)$ /actuator/$1 break;
            proxy_pass http://smep-be-dev.smepbe:8080;
            add_header X-Matched-By "API-PROXY-ACTUATOR-DEV" always;
        }

        location ^~ /api/ {
            proxy_pass http://smep-be-dev.smepbe:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            add_header X-Matched-By "API-PROXY-ROOT" always;
        }

        # ---------------------------------------------------------
        # 2. 정적 리소스
        # ---------------------------------------------------------
        location ^~ /home-dev/assets/ {
            root /usr/share/nginx/html;
            access_log off;
            add_header X-Matched-By "STATIC-USER-DEV-ASSETS" always;
        }

        # ---------------------------------------------------------
        # 3. SPA 라우팅
        # ---------------------------------------------------------
        location /home-dev/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header X-Matched-By "STATIC-USER-DEV-FALLBACK" always;
        }

        # ---------------------------------------------------------
        # 4. 루트 및 기타 정적 파일 처리
        # ---------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
