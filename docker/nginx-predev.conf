user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # 사전 압축(.gz) 파일 우선 서빙 — Content-Length 정확, sendfile 사용, 버퍼 이슈 없음
    gzip_static on;

    # 사전 압축 파일이 없는 동적 컨텐츠용 gzip (API 응답 등)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.0;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/font-woff2 font/woff2;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # -----------------------------
        # 1) 정적 파일 (JS/CSS/Assets)
        # -----------------------------
        location ^~ /home-predev/assets/ {
            alias /usr/share/nginx/html/assets/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-ASSETS-predev" always;
        }

        # JS/CSS 해시 파일 (index-xxxx.js 등)
        location ~* ^/home-predev/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif)$ {
            root /usr/share/nginx/html/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Matched-By "STATIC-FILES-PREDEV" always;
        }

        # -----------------------------
        # 2) API Proxy
        # -----------------------------
        location ^~ /home-predev/api/ {
            rewrite ^/home-predev/api/(.*)$ /api/$1 break;
            proxy_pass http://smep-be-predev.smepbe-dev.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            add_header X-Matched-By "API-PROXY-PREDEV" always;
        }

        location ^~ /home-predev/actuator/ {
            rewrite ^/home-predev/actuator/(.*)$ /actuator/$1 break;
            proxy_pass http://smep-be-predev.smepbe-dev.svc.cluster.local:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Matched-By "API-PROXY-ACTUATOR-PREDEV" always;
        }

        location ^~ /api/ {
            proxy_pass http://smep-be-predev.smepbe-dev.svc.cluster.local:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            add_header X-Matched-By "API-PROXY-ROOT-PREDEV" always;
        }

        # -----------------------------
        # 3) SPA 라우팅 (핵심)
        # -----------------------------
        location ^~ /home-predev/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /home-predev/index.html;
            add_header Cache-Control "no-store" always;
            add_header X-Matched-By "SPA-ROUTER-PREDEV" always;
        }

        # -----------------------------
        # 4) 루트 fallback
        # -----------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------
        # 5) 헬스체크
        # -----------------------------
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
